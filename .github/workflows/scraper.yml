name: IYTE Mail Checker

on:
  schedule:
    # Türkiye saatiyle (GMT+3) 08:00, 13:00 ve 17:00'de çalışır.
    # GitHub UTC kullandığı için saatleri 3 saat geri yazdık (05:00, 10:00, 14:00 UTC).
    - cron: '0 5,10,14 * * *'
  workflow_dispatch: # İstediğin zaman elinle tetikleyip test edebilmen için

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      - name: Run python script
        env:
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        run: |
          python main.py

      - name: Commit and push changes if content updated
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add previous_content.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update previous_content.txt [skip ci]" && git push)